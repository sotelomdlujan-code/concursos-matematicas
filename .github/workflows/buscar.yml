name: Buscar concursos de Matemática

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: buscar
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar concursos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_CLAVE: ${{ secrets.EMAIL_CLAVE }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python buscador_concursos.py --paginas 2

      - name: Guardar historial y página
        run: |
          git config user.name "buscador-bot"
          git config user.email "buscador-bot@users.noreply.github.com"
          git add concursos_vistos.json docs/index.html
          git diff --cached --quiet || git commit -m "Actualización automática"
          git push
